[package]
name = "nexus-eval"
version.workspace = true
edition.workspace = true

[dependencies]
nexus-core = { path = "../nexus-core" }
burn = { workspace = true, features = ["wgpu"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }

[features]
default = ["cuda"]
cuda = ["burn/cuda", "nexus-core/cuda"]
rocm = ["burn/rocm", "nexus-core/rocm"]
vulkan = ["burn/vulkan", "nexus-core/vulkan"]
metal = ["burn/metal", "nexus-core/metal"]
wgpu = ["burn/wgpu", "nexus-core/wgpu"]

[dev-dependencies]
tempfile = "3"
