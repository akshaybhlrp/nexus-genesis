[package]
name = "nexus-core"
version.workspace = true
edition.workspace = true

[features]
default = ["cuda"]
cuda = ["burn/cuda", "nexus-emns/cuda", "nexus-weight-gen/cuda"]
rocm = ["burn/rocm", "nexus-emns/rocm", "nexus-weight-gen/rocm"]
vulkan = ["burn/vulkan", "nexus-emns/vulkan", "nexus-weight-gen/vulkan"]
metal = ["burn/metal", "nexus-emns/metal", "nexus-weight-gen/metal"]
wgpu = ["burn/wgpu", "nexus-emns/wgpu", "nexus-weight-gen/wgpu"]

[dev-dependencies]
tempfile = "3"
nexus-eval = { path = "../nexus-eval" }

[dependencies]
nexus-emns = { path = "../nexus-emns", default-features = false }
nexus-memory = { path = "../nexus-memory" }
nexus-teacher = { path = "../nexus-teacher" }
nexus-weight-gen = { path = "../nexus-weight-gen" }
burn = { workspace = true, features = ["train", "autodiff", "ndarray"] }

serde = { workspace = true }
serde_json = "1.0"
rand = { workspace = true }
tokio = { workspace = true }
rayon = { workspace = true }
anyhow = { workspace = true }
memmap2 = { workspace = true }
tokenizers = { workspace = true }
parquet = { workspace = true }
arrow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
